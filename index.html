<script>
const QUESTIONS=[{"id": 1, "q": "多貓家庭的貓砂盆數量，較常見的建議原則是？", "opts": ["A. 貓數量的一半", "B. 每隻貓共用 1 盆", "C. 貓數量＋1", "D. 每個房間固定 1 盆"], "ans": "C", "exp": "常見原則是每隻貓至少有一個砂盆，再多準備一個，並分散在安全、容易到達的位置。"}, {"id": 2, "q": "貓砂盆最適合放在哪裡？", "opts": ["A. 洗衣機旁", "B. 安靜、容易到達且不易被堵住的位置", "C. 食碗正旁邊", "D. 門口人來人往處"], "ans": "B", "exp": "貓如廁時需要安全感；太吵、容易被驚嚇或被其他動物堵住的地點都可能降低使用意願。"}, {"id": 3, "q": "對多數貓來說，食物、水與貓砂盆應如何安排？", "opts": ["A. 全部集中最方便", "B. 盡量彼此分開", "C. 水放砂盆裡", "D. 食物放砂盆上方"], "ans": "B", "exp": "資源彼此分開較符合貓的需求，也可降低污染與資源衝突。"}, {"id": 4, "q": "剛到中途的新貓一直躲起來，較適合的做法是？", "opts": ["A. 強行抱出來認識環境", "B. 提供躲藏處並給牠時間", "C. 把躲藏箱拿走", "D. 一直追著摸"], "ans": "B", "exp": "躲藏是貓面對陌生環境常見的因應方式；安全躲藏處與可預期的環境有助降低壓力。"}, {"id": 5, "q": "貓抓抓板主要代表什麼？", "opts": ["A. 故意破壞", "B. 正常自然行為", "C. 缺乏服從", "D. 一定是焦慮症"], "ans": "B", "exp": "抓磨是正常貓行為，可協助爪部保養、伸展及留下氣味與視覺訊號。"}, {"id": 6, "q": "中途空間每天清潔時，哪種做法較能降低貓壓力？", "opts": ["A. 每天把所有熟悉氣味全部刷掉", "B. 在衛生允許下採較溫和、可預期的清潔方式", "C. 每天換籠位", "D. 清潔時大聲播放音樂"], "ans": "B", "exp": "貓重視熟悉氣味與可預期性；收容照護資料也建議在適當情況採 spot cleaning 以減少不必要壓力。"}, {"id": 7, "q": "貓咪喝水量會受到哪項因素影響？", "opts": ["A. 只跟毛色有關", "B. 食物含水量", "C. 尾巴長度", "D. 是否會呼嚕"], "ans": "B", "exp": "吃濕食的貓可從食物取得較多水分，因此實際飲水量可能比吃乾糧的貓少。"}, {"id": 8, "q": "想鼓勵貓增加水分攝取，哪個方法較合理？", "opts": ["A. 不提供水只餵乾糧", "B. 提供多個新鮮水源或濕食", "C. 強迫灌大量水", "D. 水碗永遠不洗"], "ans": "B", "exp": "提供容易取得的新鮮水源、濕食或在合適情況於食物中加水，都是常見增加水分攝取的方法。"}, {"id": 9, "q": "多貓家庭的水碗與食物站，較好的安排是？", "opts": ["A. 只有一個固定站", "B. 提供多個、分散的資源點", "C. 全放狹窄走道", "D. 一定要共用同一碗"], "ans": "B", "exp": "分散資源可降低競爭，也避免某隻貓阻擋其他貓取得水與食物。"}, {"id": 10, "q": "貓外出看醫生時，較安全的方式是？", "opts": ["A. 抱在懷裡上車", "B. 使用穩固的外出籠", "C. 放後車廂自由活動", "D. 用紙袋裝"], "ans": "B", "exp": "穩固外出籠可降低逃脫與交通中的受傷風險。"}, {"id": 11, "q": "搬運裝有貓的外出籠時，較穩定的方式是？", "opts": ["A. 只抓提把讓它晃", "B. 從底部支撐並保持水平", "C. 倒著拿", "D. 快速甩動"], "ans": "B", "exp": "從底部支撐並減少晃動，可讓外出籠更穩定，降低貓的不安。"}, {"id": 12, "q": "兩隻感情很好的貓外出時，最穩妥的運輸方式通常是？", "opts": ["A. 強迫塞同一籠", "B. 各自使用安全外出籠", "C. 都不裝籠", "D. 用同一條牽繩"], "ans": "B", "exp": "International Cat Care 建議多隻貓運輸時使用分開的外出籠，不強迫共用一籠。"}, {"id": 13, "q": "讓貓比較不排斥外出籠，平時可以怎麼做？", "opts": ["A. 只在打針前拿出來", "B. 平時就讓外出籠成為可探索、可休息的安全物件", "C. 把牠關在裡面處罰", "D. 在裡面製造巨響"], "ans": "B", "exp": "透過熟悉氣味、墊子、零食等正向連結，可讓外出籠不只代表看醫生。"}, {"id": 14, "q": "老貓或關節活動不便的貓，砂盆可優先考慮什麼設計？", "opts": ["A. 超高入口", "B. 容易進出的低入口", "C. 放在樓梯最上層", "D. 越小越好"], "ans": "B", "exp": "活動力下降時，低入口與容易到達的位置可減少如廁負擔。"}, {"id": 15, "q": "老貓的食水環境可如何調整？", "opts": ["A. 全放高處逼牠運動", "B. 讓資源容易到達，必要時適度墊高碗具", "C. 一天只給一次水", "D. 把水移到戶外"], "ans": "B", "exp": "高齡或疼痛貓可能不適合頻繁跳躍或低頭；資源可及性是環境調整重點。"}, {"id": 16, "q": "貓砂盆清理頻率較合理的是？", "opts": ["A. 等完全臭了再清", "B. 至少規律移除排泄物並保持清潔", "C. 一個月一次", "D. 完全不清"], "ans": "B", "exp": "髒污與氣味可能降低使用意願；ASPCA 建議至少每日清除固體排泄物。"}, {"id": 17, "q": "貓突然開始在砂盆外排尿，第一個重要觀念是？", "opts": ["A. 一定是在報復", "B. 可能有醫療或環境原因，需要評估", "C. 一定是故意搗蛋", "D. 直接處罰"], "ans": "B", "exp": "砂盆外排尿可能與下泌尿道疾病、疼痛、壓力或砂盆環境有關，不應先假設是報復。"}, {"id": 18, "q": "貓咪需要躲藏處的主要原因之一是？", "opts": ["A. 讓主人找不到", "B. 提供安全感與控制感", "C. 讓牠少吃飯", "D. 讓牠不使用砂盆"], "ans": "B", "exp": "可躲藏的安全區是貓環境需求的重要部分，尤其在陌生或壓力環境。"}, {"id": 19, "q": "中途籠舍的日常節奏，哪種較理想？", "opts": ["A. 每天完全隨機", "B. 盡量安靜且可預期", "C. 持續高噪音", "D. 每小時搬一次位置"], "ans": "B", "exp": "可預期的餵食與清潔流程有助降低收容環境中的壓力。"}, {"id": 20, "q": "貓咪資源配置中的「選擇權」是指？", "opts": ["A. 只能有一個睡覺點", "B. 提供多種安全休息、飲水或躲藏位置", "C. 所有貓都必須用同一個窩", "D. 不准離開籠子"], "ans": "B", "exp": "良好環境應讓貓能選擇休息、躲藏與使用資源的位置。"}, {"id": 21, "q": "貓咪玩耍時較不建議長期用什麼當玩具？", "opts": ["A. 逗貓棒", "B. 玩具鼠", "C. 人的手腳", "D. 食物益智玩具"], "ans": "C", "exp": "生命階段指南建議不要把人的手腳當玩具，以免建立咬抓人體的互動習慣。"}, {"id": 22, "q": "環境豐富化的重要目的之一是？", "opts": ["A. 讓房間看起來更滿", "B. 提供玩耍、探索、躲藏、攀爬等自然行為機會", "C. 讓貓不能休息", "D. 取代醫療"], "ans": "B", "exp": "符合貓自然行為需求的環境可提升福利並協助降低壓力。"}, {"id": 23, "q": "對怕生貓建立關係時，較適合的是？", "opts": ["A. 逼牠立刻接受抱抱", "B. 讓牠保有距離並使用低壓、正向互動", "C. 一直盯著牠", "D. 把躲藏處封住"], "ans": "B", "exp": "讓貓有選擇與退路，並以低壓方式逐步建立正向連結，通常比強迫接觸更合適。"}, {"id": 24, "q": "中途空間中，砂盆與食水距離的原則較接近？", "opts": ["A. 越近越好", "B. 空間允許時盡量分開", "C. 食碗放砂盆內", "D. 水碗放砂裡"], "ans": "B", "exp": "收容照護資料建議將食物、水、砂盆等基本資源盡量分開。"}, {"id": 25, "q": "貓咪突然不再使用原本正常使用的砂盆，較適合？", "opts": ["A. 先罵牠", "B. 檢查健康、砂盆環境與壓力因素", "C. 永久關籠", "D. 取消所有砂盆"], "ans": "B", "exp": "如廁行為改變可能是健康或環境問題的訊號，需找原因而非懲罰。"}, {"id": 26, "q": "公貓頻繁進砂盆、用力蹲但幾乎沒有尿，最重要的處理是？", "opts": ["A. 等兩天", "B. 儘快緊急就醫", "C. 換貓砂即可", "D. 多陪玩"], "ans": "B", "exp": "尿道阻塞是可能危及生命的急症；排尿困難、頻繁嘗試且少尿或無尿時應立即尋求獸醫處置。"}, {"id": 27, "q": "下泌尿道問題常見的警訊不包括哪一項？", "opts": ["A. 排尿疼痛", "B. 頻繁排尿", "C. 血尿", "D. 耳朵毛變長"], "ans": "D", "exp": "常見警訊包括排尿困難／疼痛、頻尿、血尿、砂盆外排尿與頻繁舔生殖區。"}, {"id": 28, "q": "貓咪突然明顯增加喝水與尿量，較適合？", "opts": ["A. 完全忽略", "B. 記錄變化並安排獸醫評估", "C. 把水收走", "D. 改用更小的砂盆"], "ans": "B", "exp": "飲水與排尿增加可見於多種疾病，包括糖尿病與腎臟等問題，值得評估。"}, {"id": 29, "q": "「食慾很好但體重下降、喝水尿尿變多」可能是哪類疾病警訊？", "opts": ["A. 糖尿病等代謝問題", "B. 只是心情好", "C. 一定是牙齒太白", "D. 一定沒事"], "ans": "A", "exp": "Cornell 指出糖尿病常見居家表現包括食慾尚可卻體重下降，以及飲水、排尿增加。"}, {"id": 30, "q": "貓咪長時間拒食並持續掉體重，較正確的是？", "opts": ["A. 讓牠餓到肯吃", "B. 應尋求獸醫評估", "C. 一定只是挑食", "D. 只換碗即可"], "ans": "B", "exp": "貓拒食可能造成嚴重健康問題；持續拒食或伴隨體重下降應由獸醫評估。"}, {"id": 31, "q": "體重管理較可靠的方法之一是？", "opts": ["A. 只看毛蓬不蓬", "B. 定期量體重並搭配體態評分", "C. 看尾巴粗細", "D. 看叫聲大小"], "ans": "B", "exp": "體重與 Body Condition Score 可協助追蹤過瘦或過重趨勢。"}, {"id": 32, "q": "肥胖可能增加貓咪哪種健康風險？", "opts": ["A. 糖尿病與關節問題", "B. 毛色改變成藍色", "C. 耳朵變長", "D. 完全沒有影響"], "ans": "A", "exp": "肥胖與糖尿病、骨關節等健康問題相關。"}, {"id": 33, "q": "觀察中途貓健康時，哪個改變值得記錄？", "opts": ["A. 食慾", "B. 飲水與排尿", "C. 排便與活動力", "D. 以上皆是"], "ans": "D", "exp": "居家照護的重要工作就是觀察與記錄日常變化，讓異常能及早被發現。"}, {"id": 34, "q": "老貓的健康檢查頻率，FelineVMA 資料較傾向？", "opts": ["A. 永遠不用檢查", "B. 至少每半年評估一次", "C. 十年一次", "D. 只有生病才看"], "ans": "B", "exp": "生命階段資料建議高齡貓至少每 6 個月進行健康檢查，疾病個體可能需要更頻繁。"}, {"id": 35, "q": "貓咪的行為突然改變，為什麼不能只當作『個性變了』？", "opts": ["A. 行為變化有時可能反映疼痛、疾病或壓力", "B. 因為貓不會變", "C. 一定是報復", "D. 一定是換季"], "ans": "A", "exp": "貓常隱藏不適，行為、活動、如廁、梳理等變化都可能具有健康意義。"}, {"id": 36, "q": "脫水可能出現哪種表現？", "opts": ["A. 精神差、食慾下降", "B. 一定變得超活潑", "C. 毛色必定變白", "D. 尾巴變短"], "ans": "A", "exp": "脫水可伴隨嗜睡、虛弱、食慾差、黏膜乾燥等表現。"}, {"id": 37, "q": "懷疑貓脫水時，最適合的處理是？", "opts": ["A. 自行亂打點滴", "B. 聯絡獸醫評估原因與程度", "C. 完全停水", "D. 只觀察一週"], "ans": "B", "exp": "脫水程度與原因需要評估；治療可能涉及皮下或靜脈輸液，應由專業人員決定。"}, {"id": 38, "q": "貓咪頻繁舔生殖器又一直跑砂盆，可能與什麼有關？", "opts": ["A. 下泌尿道不適", "B. 只是愛乾淨", "C. 一定是皮毛太長", "D. 一定是肚子餓"], "ans": "A", "exp": "頻繁舔生殖區可伴隨下泌尿道疾病症狀，若同時有排尿異常更應注意。"}, {"id": 39, "q": "看到貓血尿時，較適合？", "opts": ["A. 當作正常", "B. 安排獸醫評估", "C. 把水收走", "D. 只換罐頭口味"], "ans": "B", "exp": "血尿是下泌尿道疾病常見警訊之一，需要釐清原因。"}, {"id": 40, "q": "幼貓出現上呼吸道症狀時，中途照護的重要觀念是？", "opts": ["A. 所有病例都自己亂用抗生素", "B. 依嚴重度觀察並依既定獸醫／中途醫療流程處理", "C. 完全不管", "D. 一定洗澡"], "ans": "B", "exp": "收容醫療資料強調依嚴重程度與獸醫制定的流程處理 URI，並注意支持性照護與傳播控制。"}, {"id": 41, "q": "貓咪只有清澈鼻眼分泌物、症狀輕微時，收容照護資料常強調哪類支持？", "opts": ["A. 適口性食物、清潔鼻部分泌物、補充水分與降低壓力", "B. 強迫劇烈運動", "C. 完全斷食", "D. 自行使用人藥"], "ans": "A", "exp": "輕症 URI 的支持性照護包括維持進食、水分、清潔鼻眼分泌物與良好環境。"}, {"id": 42, "q": "貓咪生病時是否可以自行餵人類止痛藥？", "opts": ["A. 可以，劑量猜小一點", "B. 不應自行使用，應詢問獸醫", "C. 所有人藥都安全", "D. 只要混罐頭就安全"], "ans": "B", "exp": "貓對多種人用藥非常敏感；不應在未經獸醫指示下自行給藥。"}, {"id": 43, "q": "中途貓每天記錄體重、食慾、排泄的主要價值是？", "opts": ["A. 做漂亮表格而已", "B. 更容易看出趨勢與異常", "C. 讓貓變胖", "D. 取代獸醫診斷"], "ans": "B", "exp": "連續紀錄可幫助辨識變化並提供獸醫更完整的病史，但不能取代診斷。"}, {"id": 44, "q": "高齡貓突然不願跳上原本常去的地方，應考慮？", "opts": ["A. 可能有疼痛或活動力下降", "B. 一定在生氣", "C. 一定失明", "D. 一定是懶惰"], "ans": "A", "exp": "高齡貓活動模式改變可能與關節疼痛等問題有關，值得進一步評估。"}, {"id": 45, "q": "健康照護題遇到『每隻貓都一樣』的說法時，較正確的觀念是？", "opts": ["A. 所有貓都用同一套", "B. 應依年齡、生活型態、健康狀況個別化", "C. 只看品種", "D. 只看毛色"], "ans": "B", "exp": "疫苗、預防保健與照護策略都應依生命階段、生活方式及個體健康風險調整。"}, {"id": 46, "q": "貓咪的飲食選擇，最基本應重視什麼？", "opts": ["A. 是否為完整均衡、適合其生命階段的飲食", "B. 包裝最可愛", "C. 顏色最鮮豔", "D. 顆粒最大"], "ans": "A", "exp": "日常主食應能提供貓所需的完整均衡營養，並考慮生命階段與健康狀況。"}, {"id": 47, "q": "濕食對水分攝取可能有什麼幫助？", "opts": ["A. 含水量較高，可增加總水分攝取", "B. 一定讓貓脫水", "C. 完全沒有水", "D. 只能當玩具"], "ans": "A", "exp": "濕食可含相當高比例水分，因此可成為每日水分來源的一部分。"}, {"id": 48, "q": "貓咪吃濕食後喝水看起來變少，可能是？", "opts": ["A. 因為從食物取得較多水分", "B. 一定腎衰竭", "C. 一定討厭水", "D. 一定正常到不用觀察"], "ans": "A", "exp": "濕食本身提供水分，所以飲水碗攝取量可能下降；仍應觀察整體健康與排尿。"}, {"id": 49, "q": "幫過重貓減重時，較適合？", "opts": ["A. 突然完全斷食", "B. 與獸醫討論理想體重與安全減重計畫", "C. 每天只吃零食", "D. 不量體重"], "ans": "B", "exp": "貓拒食可能造成嚴重問題；體重管理應以安全、漸進方式進行。"}, {"id": 50, "q": "肥胖貓減重的主要目的之一是？", "opts": ["A. 只為拍照好看", "B. 降低與肥胖相關的健康風險並改善活動品質", "C. 讓牠更怕人", "D. 讓毛變長"], "ans": "B", "exp": "過重會影響活動與生活品質，也與糖尿病及關節問題等風險相關。"}, {"id": 51, "q": "貓突然拒絕平常愛吃的食物，且持續不吃，較適合？", "opts": ["A. 覺得牠在鬧脾氣就一直等", "B. 評估健康狀況並聯絡獸醫", "C. 把水也收掉", "D. 強迫跑步"], "ans": "B", "exp": "持續拒食尤其伴隨體重下降或疾病症狀時，不應只當作挑食。"}, {"id": 52, "q": "中途貓換食時，較合理的原則是？", "opts": ["A. 完全不觀察", "B. 留意接受度、食慾與腸胃反應，必要時循序調整", "C. 每餐換十種", "D. 一定要一天完成"], "ans": "B", "exp": "飲食改變應觀察個體反應；某些貓對突然改變較敏感。"}, {"id": 53, "q": "水碗應如何提供？", "opts": ["A. 維持乾淨、新鮮且容易取得", "B. 一週換一次", "C. 只在吃飯時給", "D. 放到貓到不了的地方"], "ans": "A", "exp": "持續可取得的新鮮水是維持水合的重要基本照護。"}, {"id": 54, "q": "多貓家庭若某隻貓常霸佔水碗，較好的改善是？", "opts": ["A. 讓其他貓忍耐", "B. 增加並分散水源", "C. 把水全部收走", "D. 只給霸佔的貓喝"], "ans": "B", "exp": "資源衝突可能使弱勢貓無法充分喝水，多個分散水源可降低此問題。"}, {"id": 55, "q": "食物益智玩具（puzzle feeder）可能帶來什麼？", "opts": ["A. 提供覓食與活動刺激", "B. 取代所有正餐", "C. 讓貓不用喝水", "D. 取代醫療"], "ans": "A", "exp": "適合個體的益智餵食可提供心理刺激與活動機會。"}, {"id": 56, "q": "貓的理想體重最適合怎麼判斷？", "opts": ["A. 只跟別人的貓比較", "B. 結合體重、體態評分與獸醫建議", "C. 看毛量", "D. 看臉圓不圓"], "ans": "B", "exp": "單看公斤數不足以判斷體態；BCS 與個體條件更有意義。"}, {"id": 57, "q": "高齡貓的飲食是否一定跟年輕貓完全相同？", "opts": ["A. 一定相同", "B. 應依生命階段、體態與健康狀況個別評估", "C. 老貓只能吃零食", "D. 老貓不能喝水"], "ans": "B", "exp": "高齡貓的營養需求與疾病狀況可能不同，應個別化。"}, {"id": 58, "q": "為了讓貓喝更多水，飲水機是否一定比水碗好？", "opts": ["A. 一定", "B. 不一定，貓有個體偏好", "C. 水碗一定有毒", "D. 所有貓都怕流動水"], "ans": "B", "exp": "部分貓偏好飲水機，但並非所有貓都一樣；重點是提供可接受且乾淨的水源。"}, {"id": 59, "q": "中途照護中，突然發現某貓食量明顯下降，最重要的是？", "opts": ["A. 記錄並評估是否伴隨其他症狀", "B. 完全不管", "C. 只換碗顏色", "D. 立刻禁水"], "ans": "A", "exp": "食慾是重要健康指標，下降若持續或伴隨其他異常應進一步處理。"}, {"id": 60, "q": "貓咪減重時最不適合的方式是？", "opts": ["A. 依計畫控制熱量", "B. 追蹤體重", "C. 突然完全斷食", "D. 增加適合的活動"], "ans": "C", "exp": "貓不適合以突然斷食方式減重；拒食本身可能造成嚴重醫療問題。"}, {"id": 61, "q": "怕生貓哈氣時，哈氣通常更接近？", "opts": ["A. 一種警告與增加距離的訊號", "B. 邀請你抱牠", "C. 一定想攻擊到底", "D. 一定生病"], "ans": "A", "exp": "哈氣常表示緊張、害怕或希望對方保持距離，應尊重訊號並降低壓力。"}, {"id": 62, "q": "親訓怕生貓時，較好的目標是？", "opts": ["A. 最快強迫摸到牠", "B. 逐步建立安全感與正向連結", "C. 取消所有躲藏處", "D. 一直盯著眼睛"], "ans": "B", "exp": "社會化不是強迫接觸，而是讓貓在可控制、低壓的情境中逐步建立信任。"}, {"id": 63, "q": "貓躲在紙箱裡時，較適合？", "opts": ["A. 每次都伸手把牠抓出來", "B. 把躲藏處視為安全區，必要時用低壓方式互動", "C. 把紙箱丟掉", "D. 敲箱子"], "ans": "B", "exp": "安全躲藏處可降低陌生環境壓力。"}, {"id": 64, "q": "貓與貓之間的資源衝突，可能怎麼表現？", "opts": ["A. 只有打架才算", "B. 也可能是堵路、盯視、讓另一隻不敢靠近資源", "C. 完全看不出來", "D. 只會發生在戶外"], "ans": "B", "exp": "貓間緊張不一定有明顯打架，也可能以阻擋資源或回避等較細微方式出現。"}, {"id": 65, "q": "降低多貓家庭緊張的一項基本做法是？", "opts": ["A. 減少所有資源", "B. 提供足夠且分散的關鍵資源", "C. 強迫一起吃一碗", "D. 強迫睡同一窩"], "ans": "B", "exp": "分散食水、砂盆、休息與躲藏資源可降低競爭。"}, {"id": 66, "q": "新貓到家第一天就與原住民直接面對面，是否總是最佳做法？", "opts": ["A. 是", "B. 不是，通常應依個體狀況採漸進、低壓的介紹", "C. 一定要打過才會熟", "D. 完全不需要管理"], "ans": "B", "exp": "新環境與陌生貓都可能造成壓力，漸進式介紹較能控制刺激與衝突。"}, {"id": 67, "q": "用食物、遊戲建立正向連結時，前提是？", "opts": ["A. 貓仍在可接受刺激、願意參與的狀態", "B. 貓已經極度恐慌仍要硬餵", "C. 一定要抱著吃", "D. 不能讓貓離開"], "ans": "A", "exp": "正向互動應尊重個體狀態與選擇；過度恐懼時應先降低壓力。"}, {"id": 68, "q": "貓咪抓家具時，較好的管理方向是？", "opts": ["A. 體罰", "B. 提供合適抓板並調整環境", "C. 永久關籠", "D. 取消所有抓磨機會"], "ans": "B", "exp": "抓磨是正常行為，應提供適合材質、位置與方向的替代物。"}, {"id": 69, "q": "貓咪不喜歡被抱，代表？", "opts": ["A. 一定不愛人", "B. 可能只是偏好不同的互動方式", "C. 一定有攻擊性", "D. 一定不能送養"], "ans": "B", "exp": "親人程度與喜歡被抱並不是同一件事，個體偏好應被尊重。"}, {"id": 70, "q": "正向增強較接近哪個做法？", "opts": ["A. 做出希望行為後給予喜歡的獎勵", "B. 做錯就大吼", "C. 噴水處罰", "D. 強迫固定姿勢"], "ans": "A", "exp": "正向增強以獎勵增加希望行為出現的機會，是較低壓的訓練方向。"}, {"id": 71, "q": "貓咪突然變得比平常易怒，應先想到？", "opts": ["A. 可能有疼痛、疾病或壓力", "B. 一定是壞脾氣", "C. 一定在報復", "D. 一定要處罰"], "ans": "A", "exp": "行為變化可能是身體不適或壓力的表現，應先排除相關原因。"}, {"id": 72, "q": "貓咪需要垂直空間的原因之一是？", "opts": ["A. 可增加環境選擇與安全感", "B. 讓牠不能睡", "C. 讓砂盆更髒", "D. 取代飲水"], "ans": "A", "exp": "攀高、觀察與休息位置是環境豐富化的重要元素。"}, {"id": 73, "q": "面對極度緊張的貓，哪個互動較不理想？", "opts": ["A. 降低聲音與動作", "B. 給牠退路", "C. 持續逼近直到牠放棄反抗", "D. 使用熟悉氣味與安全躲藏處"], "ans": "C", "exp": "強迫接觸可能增加恐懼與防禦行為。"}, {"id": 74, "q": "中途親訓進度是否應每隻貓都一樣？", "opts": ["A. 是，固定三天完成", "B. 否，應依個體反應調整", "C. 只看年齡", "D. 只看毛色"], "ans": "B", "exp": "貓的過去經驗、氣質、健康與環境都會影響適應速度。"}, {"id": 75, "q": "對新環境中的貓來說，「可預期」通常有什麼好處？", "opts": ["A. 有助降低不確定性與壓力", "B. 讓牠變胖", "C. 讓牠不喝水", "D. 完全沒有影響"], "ans": "A", "exp": "規律的照護流程與穩定環境有助降低壓力。"}, {"id": 76, "q": "新進中途貓與既有貓群直接混住前，最重要的觀念是？", "opts": ["A. 先做健康與傳染風險評估並依中途流程隔離／管理", "B. 越快混越好", "C. 不用知道健康史", "D. 共用所有用品"], "ans": "A", "exp": "中途環境需重視傳染病控制、健康評估與適當隔離管理。"}, {"id": 77, "q": "中途發現疑似傳染性上呼吸道疾病時，較重要的是？", "opts": ["A. 依既定醫療與隔離流程處理並降低交叉傳播", "B. 讓所有貓共用碗", "C. 隨意換籠", "D. 不做紀錄"], "ans": "A", "exp": "收容照護資料強調 URI 的疾病傳播預防、隔離與獸醫監督流程。"}, {"id": 78, "q": "中途用品在病貓與健康貓間共用時，應注意？", "opts": ["A. 交叉感染風險", "B. 只要同顏色就沒問題", "C. 完全不用清潔", "D. 共用越多越好"], "ans": "A", "exp": "疾病控制需考慮器具、人員動線與清潔消毒，避免將病原帶到健康貓。"}, {"id": 79, "q": "送養評估最重要的方向是？", "opts": ["A. 只看認養人照片好不好看", "B. 貓咪需求與家庭條件是否相符", "C. 誰先私訊就給誰", "D. 完全不問居住環境"], "ans": "B", "exp": "好的配對重點是個體需求、照護能力與環境是否適合，而不是單純追求最快送出。"}, {"id": 80, "q": "特殊需求貓送養時，較重要的是？", "opts": ["A. 隱瞞所有需求", "B. 清楚說明照護需求與可能的後續成本", "C. 說牠完全不需要照顧", "D. 不提供醫療紀錄"], "ans": "B", "exp": "透明資訊有助認養人做知情決定，也能提升長期配對穩定性。"}, {"id": 81, "q": "認養人家中已有貓時，應提醒什麼？", "opts": ["A. 新舊貓一定立刻合得來", "B. 需要有漸進介紹與資源分配的心理準備", "C. 只能共用一個砂盆", "D. 第一天一定一起睡"], "ans": "B", "exp": "多貓家庭需重視漸進適應與資源分散，以降低緊張。"}, {"id": 82, "q": "送養前提供貓咪既往健康紀錄有什麼價值？", "opts": ["A. 幫助後續照護與獸醫掌握病史", "B. 完全沒用", "C. 只增加紙張", "D. 會讓貓變緊張"], "ans": "A", "exp": "醫療、疫苗、用藥、檢查與行為紀錄可支持照護連續性。"}, {"id": 83, "q": "疫苗計畫最適合怎麼決定？", "opts": ["A. 所有貓完全相同", "B. 依年齡、生活型態、健康與暴露風險由獸醫規劃", "C. 看毛色", "D. 自己猜"], "ans": "B", "exp": "FelineVMA/AAHA 指南強調疫苗建議應依生命階段、環境與生活型態風險個別化。"}, {"id": 84, "q": "中途貓是否需要身分識別規劃，例如晶片？", "opts": ["A. 值得納入認養與走失預防流程", "B. 完全沒必要", "C. 只有狗需要", "D. 晶片是 GPS"], "ans": "A", "exp": "生命階段指南建議與獸醫討論身分識別／晶片；晶片是身分辨識工具，不是即時 GPS。"}, {"id": 85, "q": "認養後若貓躲了幾天，較合理的說法是？", "opts": ["A. 一定認養失敗", "B. 新環境適應速度有個體差異，可提供安全區並觀察", "C. 立刻退養", "D. 強迫牠巡完整間房"], "ans": "B", "exp": "躲藏與謹慎探索是常見適應反應；安全區與低壓環境有助過渡。"}, {"id": 86, "q": "中途照護紀錄中，哪一項最值得留下？", "opts": ["A. 健康、用藥、飲食、排泄、行為與重要事件", "B. 只記可愛照片", "C. 只記名字", "D. 都不用記"], "ans": "A", "exp": "完整紀錄有助不同照護者交接，也讓獸醫與認養人掌握趨勢。"}, {"id": 87, "q": "送養時對怕生貓的描述，較負責任的是？", "opts": ["A. 隱瞞怕生", "B. 說明牠需要時間、適合的互動方式與目前進度", "C. 保證第一天就親人", "D. 說牠永遠不會進步"], "ans": "B", "exp": "真實描述個性與需求有助找到能接受其節奏的家庭。"}, {"id": 88, "q": "中途發生疾病群聚時，較適合？", "opts": ["A. 只治療  video.addEventListener('error',()=>{play.hidden=true;help.textContent='影片無法播放，可略過開場進入遊戲。'});
 video.addEventListener('playing',()=>{play.hidden=!video.muted;help.textContent=video.muted?'動畫播放中；點「開啟聲音」可聽音樂。':'開場播放完畢後，會自動進入遊戲。'});
 play.addEventListener('click',async()=>{video.muted=false;try{await video.play();play.hidden=true;help.textContent='開場播放完畢後，會自動進入遊戲。'}catch(e){video.muted=true;play.hidden=false;help.textContent='無法開啟聲音，動畫會繼續播放。'}});
 skip.addEventListener('click',enterGame);
 async function begin(){try{await video.play()}catch(e){video.muted=true;try{await video.play();play.hidden=false;help.textContent='動畫播放中；點「開啟聲音」可聽音樂。'}catch(err){video.muted=false;play.textContent='▶ 播放開場';play.hidden=false;help.textContent='點播放開場，或略過進入遊戲。'}}}
 begin();
})();

<script>
// Keep the opening animation responsive while the game artwork downloads.
(function preloadArtwork(){
 const files=['background.webp','cat_fu.webp','cat_mo.webp','cat_grandma.webp','cat_tripod.webp','cat_king.webp','job_vet.webp','job_trainer.webp','job_fund.webp','job_network.webp'];
 const panel=document.querySelector('#artLoader');
 const label=document.querySelector('#artLoadStatus');
 const retry=document.querySelector('#artLoadRetry');
 let remaining=files.length,failed=[];
 function update(){
   label.textContent=failed.length ? `有 ${failed.length} 張圖片載入失敗，請重試。` : `正在準備貓咪與職業卡… ${files.length-remaining} / ${files.length}`;
   if(remaining===0){
     if(failed.length){retry.hidden=false;return}
     document.body.classList.remove('art-loading');panel.hidden=true;
   }
 }
 function load(file){
   const img=new Image();
   img.onload=()=>{remaining--;update()};
   img.onerror=()=>{remaining--;failed.push(file);update()};
   img.src=file;
 }
 retry.addEventListener('click',()=>{const again=failed;failed=[];remaining=again.length;retry.hidden=true;update();again.forEach(load)});
 update();files.forEach(load);
})();
</script></body></html>
